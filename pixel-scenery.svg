<svg width="1200" height="400" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">

  <defs>

    <!-- Pixelated animation -->
    <style>
      .pixel {
        shape-rendering: crispEdges;
      }

      /* Clouds moving */
      .cloud1 {
        animation: cloudMove1 18s linear infinite;
      }

      .cloud2 {
        animation: cloudMove2 25s linear infinite;
      }

      @keyframes cloudMove1 {
        from { transform: translateX(-180px); }
        to   { transform: translateX(1250px); }
      }

      @keyframes cloudMove2 {
        from { transform: translateX(1250px); }
        to   { transform: translateX(-250px); }
      }

      /* Sun floating */
      .sun {
        animation: sunFloat 3s ease-in-out infinite;
      }

      @keyframes sunFloat {
        0%,100% { transform: translateY(0px); }
        50% { transform: translateY(8px); }
      }

      /* Water */
      .water {
        animation: waterMove 2s steps(4) infinite;
      }

      @keyframes waterMove {
        0% { transform: translateX(0px); }
        25% { transform: translateX(8px); }
        50% { transform: translateX(0px); }
        75% { transform: translateX(-8px); }
        100% { transform: translateX(0px); }
      }

      /* Character walking */
      .player {
        animation: playerWalk 0.7s steps(2) infinite;
      }

      @keyframes playerWalk {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-5px); }
        100% { transform: translateY(0px); }
      }

      /* Birds */
      .bird {
        animation: birdFly 14s linear infinite;
      }

      @keyframes birdFly {
        from { transform: translateX(-100px); }
        to { transform: translateX(1300px); }
      }

      /* Stars blinking */
      .star {
        animation: blink 1.5s steps(2) infinite;
      }

      @keyframes blink {
        0%,100% { opacity: 1; }
        50% { opacity: 0.25; }
      }

    </style>
  </defs>


  <!-- ========================= -->
  <!-- NIGHT / SKY BACKGROUND -->
  <!-- ========================= -->

  <rect width="1200" height="400" fill="#101A3A"></rect>

  <!-- Moon -->
  <g class="sun pixel">
    <rect x="920" y="55" width="50" height="50" fill="#FFE8A3"></rect>

    <rect x="970" y="65" width="15" height="15" fill="#101A3A"></rect>

    <rect x="950" y="90" width="10" height="10" fill="#D9C27C"></rect>
  </g>


  <!-- ========================= -->
  <!-- STARS -->
  <!-- ========================= -->

  <g class="star pixel" fill="#FFFFFF">

    <rect x="100" y="55" width="5" height="5"></rect>
    <rect x="300" y="95" width="5" height="5"></rect>
    <rect x="450" y="45" width="5" height="5"></rect>
    <rect x="600" y="80" width="5" height="5"></rect>
    <rect x="760" y="40" width="5" height="5"></rect>
    <rect x="1080" y="120" width="5" height="5"></rect>

  </g>


  <!-- ========================= -->
  <!-- CLOUD 1 -->
  <!-- ========================= -->

  <g class="cloud1 pixel" fill="#25345C">

    <rect x="100" y="100" width="120" height="25"></rect>
    <rect x="130" y="85" width="70" height="40"></rect>
    <rect x="165" y="75" width="45" height="50"></rect>

  </g>


  <!-- ========================= -->
  <!-- CLOUD 2 -->
  <!-- ========================= -->

  <g class="cloud2 pixel" fill="#1D2B4D">

    <rect x="750" y="130" width="140" height="25"></rect>
    <rect x="785" y="110" width="75" height="45"></rect>
    <rect x="820" y="95" width="45" height="60"></rect>

  </g>


  <!-- ========================= -->
  <!-- BACK MOUNTAINS -->
  <!-- ========================= -->

  <polygon points="0,260 180,110 360,260" fill="#243B5A" class="pixel"></polygon>

  <polygon points="250,260 470,90 680,260" fill="#2D4966" class="pixel"></polygon>

  <polygon points="570,260 790,120 1000,260" fill="#243B5A" class="pixel"></polygon>

  <polygon points="850,260 1030,100 1200,250" fill="#2D4966" class="pixel"></polygon>


  <!-- ========================= -->
  <!-- SNOW CAPS -->
  <!-- ========================= -->

  <polygon points="415,130 470,90 525,135 490,125 470,145 450,125" fill="#DCE8F2" class="pixel"></polygon>

  <polygon points="980,145 1030,100 1080,145 1045,130 1030,150 1010,130" fill="#DCE8F2" class="pixel"></polygon>


  <!-- ========================= -->
  <!-- BACK GRASS -->
  <!-- ========================= -->

  <path d="M0 250
       Q150 210 300 255
       Q450 210 600 255
       Q750 210 900 250
       Q1050 205 1200 250
       L1200 400
       L0 400 Z" fill="#246B45"></path>


  <!-- ========================= -->
  <!-- FRONT GRASS -->
  <!-- ========================= -->

  <path d="M0 290
       Q150 250 300 295
       Q450 255 600 300
       Q750 255 900 295
       Q1050 250 1200 290
       L1200 400
       L0 400 Z" fill="#174D36"></path>


  <!-- ========================= -->
  <!-- RIVER -->
  <!-- ========================= -->

  <path d="M500 400
       Q560 350 620 320
       Q680 285 760 275
       Q710 320 750 345
       Q790 375 850 400 Z" fill="#247FA3" class="pixel"></path>


  <!-- Water animation -->

  <g class="water pixel" fill="#55C7E8">

    <rect x="570" y="355" width="70" height="6"></rect>
    <rect x="660" y="330" width="55" height="6"></rect>
    <rect x="725" y="305" width="40" height="6"></rect>

  </g>


  <!-- ========================= -->
  <!-- TREES -->
  <!-- ========================= -->

  <!-- Tree 1 -->

  <g class="pixel">

    <rect x="110" y="230" width="18" height="70" fill="#663C2A"></rect>

    <rect x="75" y="190" width="90" height="55" fill="#17623C"></rect>

    <rect x="95" y="160" width="50" height="50" fill="#20804B"></rect>

  </g>


  <!-- Tree 2 -->

  <g class="pixel">

    <rect x="1030" y="225" width="18" height="75" fill="#663C2A"></rect>

    <rect x="990" y="185" width="100" height="60" fill="#17623C"></rect>

    <rect x="1010" y="150" width="60" height="55" fill="#20804B"></rect>

  </g>


  <!-- Tree 3 -->

  <g class="pixel">

    <rect x="270" y="250" width="14" height="55" fill="#663C2A"></rect>

    <rect x="240" y="215" width="75" height="55" fill="#17623C"></rect>

    <rect x="255" y="185" width="45" height="50" fill="#20804B"></rect>

  </g>


  <!-- ========================= -->
  <!-- PIXEL FLOWERS -->
  <!-- ========================= -->

  <g class="pixel">

    <!-- Flower 1 -->

    <rect x="350" y="315" width="5" height="15" fill="#65A85A"></rect>

    <rect x="340" y="305" width="25" height="8" fill="#FF6B8A"></rect>

    <rect x="348" y="297" width="8" height="8" fill="#FFD166"></rect>


    <!-- Flower 2 -->

    <rect x="920" y="320" width="5" height="15" fill="#65A85A"></rect>

    <rect x="910" y="310" width="25" height="8" fill="#FFD166"></rect>

    <rect x="918" y="302" width="8" height="8" fill="#FF6B8A"></rect>

  </g>


  <!-- ========================= -->
  <!-- FLYING BIRDS -->
  <!-- ========================= -->

  <g class="bird pixel" fill="#FFFFFF">

    <rect x="250" y="135" width="15" height="5"></rect>

    <rect x="265" y="140" width="15" height="5"></rect>

    <rect x="280" y="135" width="15" height="5"></rect>

  </g>


  <!-- ========================= -->
  <!-- PIXEL PLAYER -->
  <!-- ========================= -->

  <g class="player pixel">

    <!-- Head -->

    <rect x="575" y="245" width="25" height="25" fill="#F2B38F"></rect>

    <!-- Hair -->

    <rect x="575" y="240" width="25" height="10" fill="#3A2635"></rect>

    <rect x="570" y="245" width="8" height="15" fill="#3A2635"></rect>


    <!-- Body -->

    <rect x="570" y="270" width="35" height="40" fill="#3F7CAC"></rect>


    <!-- Arms -->

    <rect x="560" y="275" width="10" height="30" fill="#F2B38F"></rect>

    <rect x="605" y="275" width="10" height="30" fill="#F2B38F"></rect>


    <!-- Pants -->

    <rect x="570" y="310" width="16" height="25" fill="#26364A"></rect>

    <rect x="589" y="310" width="16" height="25" fill="#26364A"></rect>


    <!-- Shoes -->

    <rect x="565" y="335" width="22" height="8" fill="#111827"></rect>

    <rect x="590" y="335" width="22" height="8" fill="#111827"></rect>

  </g>


  <!-- ========================= -->
  <!-- GROUND PIXELS -->
  <!-- ========================= -->

  <g class="pixel" fill="#0E3928">

    <rect x="0" y="365" width="1200" height="35"></rect>

    <rect x="70" y="350" width="20" height="15"></rect>
    <rect x="180" y="360" width="15" height="15"></rect>
    <rect x="310" y="345" width="20" height="20"></rect>
    <rect x="420" y="365" width="15" height="15"></rect>
    <rect x="900" y="350" width="20" height="15"></rect>
    <rect x="1100" y="360" width="15" height="15"></rect>

  </g>

</svg>