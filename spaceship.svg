<svg width="100%" height="220" viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#010409"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff3b0"/>
      <stop offset="45%" stop-color="#ffa657"/>
      <stop offset="100%" stop-color="#f76b3c"/>
    </linearGradient>
    <style>
      .pixel { shape-rendering: crispEdges; }

      @keyframes twinkle {
        0%, 100% { opacity: .15; }
        50% { opacity: 1; }
      }
      .star { animation: twinkle 2.4s ease-in-out infinite; }

      @keyframes driftFar {
        from { transform: translateX(0); }
        to   { transform: translateX(-900px); }
      }
      @keyframes driftNear {
        from { transform: translateX(0); }
        to   { transform: translateX(-900px); }
      }
      .layer-far  { animation: driftFar 40s linear infinite; }
      .layer-near { animation: driftNear 22s linear infinite; }

      /* ship: absolute positions baked into every frame so CSS transform
         doesn't clobber the base placement. Two dodge events per 8s loop,
         timed to meet the two hazard asteroids below. */
      @keyframes shipDodge {
        0%   { transform: translate(420px,80px)  rotate(0deg); }
        8%   { transform: translate(422px,74px)  rotate(1deg); }
        16%  { transform: translate(420px,80px)  rotate(0deg); }
        30%  { transform: translate(418px,82px)  rotate(-1deg); }
        38%  { transform: translate(420px,68px)  rotate(-4deg); }
        45%  { transform: translate(425px,44px)  rotate(-9deg); }
        52%  { transform: translate(420px,80px)  rotate(0deg); }
        60%  { transform: translate(422px,76px)  rotate(1deg); }
        70%  { transform: translate(417px,85px)  rotate(3deg); }
        78%  { transform: translate(420px,98px)  rotate(6deg); }
        83%  { transform: translate(415px,120px) rotate(10deg); }
        90%  { transform: translate(420px,80px)  rotate(0deg); }
        100% { transform: translate(420px,80px)  rotate(0deg); }
      }
      #ship { animation: shipDodge 8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }

      @keyframes flicker {
        0%   { transform: scaleY(1)    translateY(0); opacity: 1; }
        30%  { transform: scaleY(1.35) translateY(2px); opacity: .85; }
        60%  { transform: scaleY(0.85) translateY(-1px); opacity: 1; }
        100% { transform: scaleY(1.2)  translateY(1px); opacity: .9; }
      }
      #flame { animation: flicker .35s steps(4) infinite; transform-box: fill-box; transform-origin: top center; }

      /* hazard asteroids -- these are the ones the ship is timed to dodge.
         Absolute (x,y) baked into each frame, matched to shipDodge above. */
      @keyframes hazardUp {
        0%   { transform: translate(900px,90px)  rotate(0deg); }
        100% { transform: translate(-120px,90px) rotate(360deg); }
      }
      @keyframes hazardDown {
        0%   { transform: translate(900px,95px)  rotate(0deg); }
        100% { transform: translate(-120px,95px) rotate(-360deg); }
      }
      /* ambient asteroids -- pass at heights the ship never occupies,
         just for background traffic, not synced to any dodge. */
      @keyframes driftTop {
        0%   { transform: translate(900px,16px)  rotate(0deg); }
        100% { transform: translate(-120px,16px) rotate(-300deg); }
      }
      @keyframes driftBottom {
        0%   { transform: translate(900px,172px) rotate(0deg); }
        100% { transform: translate(-120px,172px) rotate(300deg); }
      }
      .asteroid { transform-box: fill-box; transform-origin: center; }
      .hazard-up    { animation: hazardUp 8s linear infinite; }
      .hazard-down  { animation: hazardDown 8s linear infinite; animation-delay: 2.79s; }
      .drift-top    { animation: driftTop 11s linear infinite; animation-delay: 1s; }
      .drift-bottom { animation: driftBottom 9s linear infinite; animation-delay: 4.4s; }

      /* near-miss spark bursts, timed to flash right as each hazard
         would have connected with the ship's idle position */
      @keyframes sparkUp {
        0%, 39%  { opacity: 0; transform: translate(428px,84px) scale(.2); }
        42%      { opacity: 1; transform: translate(428px,84px) scale(1); }
        46%      { opacity: 1; transform: translate(428px,84px) scale(1.35); }
        50%, 100%{ opacity: 0; transform: translate(428px,84px) scale(1.6); }
      }
      @keyframes sparkDown {
        0%, 75%  { opacity: 0; transform: translate(423px,104px) scale(.2); }
        79%      { opacity: 1; transform: translate(423px,104px) scale(1); }
        83%      { opacity: 1; transform: translate(423px,104px) scale(1.35); }
        87%, 100%{ opacity: 0; transform: translate(423px,104px) scale(1.6); }
      }
      .spark { transform-box: fill-box; transform-origin: center; }
      .spark-up   { animation: sparkUp 8s linear infinite; }
      .spark-down { animation: sparkDown 8s linear infinite; }

      @keyframes blinkText {
        0%, 100% { opacity: 1; }
        50% { opacity: .35; }
      }
      #hud { animation: blinkText 1.6s steps(2) infinite; }
    </style>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="900" height="220" fill="url(#bg)"/>

  <!-- starfield: far layer (small dim, slow) -->
  <g class="layer-far" fill="#c9d1d9">
    <g>
      <circle class="star" cx="20"  cy="18"  r="1.2" style="animation-delay:.1s"/>
      <circle class="star" cx="95"  cy="60"  r="1"   style="animation-delay:.6s"/>
      <circle class="star" cx="160" cy="30"  r="1.4" style="animation-delay:1.1s"/>
      <circle class="star" cx="230" cy="90"  r="1"   style="animation-delay:.3s"/>
      <circle class="star" cx="300" cy="15"  r="1.2" style="animation-delay:1.6s"/>
      <circle class="star" cx="370" cy="70"  r="1"   style="animation-delay:.9s"/>
      <circle class="star" cx="440" cy="40"  r="1.3" style="animation-delay:.2s"/>
      <circle class="star" cx="510" cy="100" r="1"   style="animation-delay:1.3s"/>
      <circle class="star" cx="580" cy="20"  r="1.2" style="animation-delay:.7s"/>
      <circle class="star" cx="650" cy="85"  r="1"   style="animation-delay:1.9s"/>
      <circle class="star" cx="720" cy="50"  r="1.4" style="animation-delay:.4s"/>
      <circle class="star" cx="790" cy="25"  r="1"   style="animation-delay:1.1s"/>
      <circle class="star" cx="850" cy="95"  r="1.2" style="animation-delay:.8s"/>
    </g>
    <g transform="translate(900,0)">
      <circle class="star" cx="20"  cy="18"  r="1.2" style="animation-delay:.1s"/>
      <circle class="star" cx="95"  cy="60"  r="1"   style="animation-delay:.6s"/>
      <circle class="star" cx="160" cy="30"  r="1.4" style="animation-delay:1.1s"/>
      <circle class="star" cx="230" cy="90"  r="1"   style="animation-delay:.3s"/>
      <circle class="star" cx="300" cy="15"  r="1.2" style="animation-delay:1.6s"/>
      <circle class="star" cx="370" cy="70"  r="1"   style="animation-delay:.9s"/>
      <circle class="star" cx="440" cy="40"  r="1.3" style="animation-delay:.2s"/>
      <circle class="star" cx="510" cy="100" r="1"   style="animation-delay:1.3s"/>
      <circle class="star" cx="580" cy="20"  r="1.2" style="animation-delay:.7s"/>
      <circle class="star" cx="650" cy="85"  r="1"   style="animation-delay:1.9s"/>
      <circle class="star" cx="720" cy="50"  r="1.4" style="animation-delay:.4s"/>
      <circle class="star" cx="790" cy="25"  r="1"   style="animation-delay:1.1s"/>
      <circle class="star" cx="850" cy="95"  r="1.2" style="animation-delay:.8s"/>
    </g>
  </g>

  <!-- starfield: near layer (brighter, faster) -->
  <g class="layer-near" fill="#79c0ff">
    <g>
      <circle class="star" cx="50"  cy="140" r="1.6" style="animation-delay:.2s"/>
      <circle class="star" cx="140" cy="170" r="1.3" style="animation-delay:.9s"/>
      <circle class="star" cx="240" cy="130" r="1.6" style="animation-delay:1.4s"/>
      <circle class="star" cx="330" cy="185" r="1.2" style="animation-delay:.5s"/>
      <circle class="star" cx="420" cy="150" r="1.5" style="animation-delay:1.8s"/>
      <circle class="star" cx="510" cy="175" r="1.2" style="animation-delay:.3s"/>
      <circle class="star" cx="600" cy="135" r="1.6" style="animation-delay:1s"/>
      <circle class="star" cx="690" cy="180" r="1.3" style="animation-delay:.6s"/>
      <circle class="star" cx="780" cy="145" r="1.5" style="animation-delay:1.5s"/>
      <circle class="star" cx="860" cy="165" r="1.2" style="animation-delay:.4s"/>
    </g>
    <g transform="translate(900,0)">
      <circle class="star" cx="50"  cy="140" r="1.6" style="animation-delay:.2s"/>
      <circle class="star" cx="140" cy="170" r="1.3" style="animation-delay:.9s"/>
      <circle class="star" cx="240" cy="130" r="1.6" style="animation-delay:1.4s"/>
      <circle class="star" cx="330" cy="185" r="1.2" style="animation-delay:.5s"/>
      <circle class="star" cx="420" cy="150" r="1.5" style="animation-delay:1.8s"/>
      <circle class="star" cx="510" cy="175" r="1.2" style="animation-delay:.3s"/>
      <circle class="star" cx="600" cy="135" r="1.6" style="animation-delay:1s"/>
      <circle class="star" cx="690" cy="180" r="1.3" style="animation-delay:.6s"/>
      <circle class="star" cx="780" cy="145" r="1.5" style="animation-delay:1.5s"/>
      <circle class="star" cx="860" cy="165" r="1.2" style="animation-delay:.4s"/>
    </g>
  </g>

  <!-- HAZARD asteroid: same height as ship's idle line -> triggers the UP dodge -->
  <g class="asteroid hazard-up">
    <g class="pixel" fill="#8b949e">
      <rect x="0" y="6" width="6" height="6"/><rect x="6" y="0" width="6" height="6"/><rect x="12" y="0" width="6" height="6"/>
      <rect x="0" y="12" width="6" height="6"/><rect x="6" y="6" width="6" height="6"/><rect x="12" y="6" width="6" height="6"/><rect x="18" y="6" width="6" height="6"/>
      <rect x="6" y="12" width="6" height="6"/><rect x="12" y="12" width="6" height="6"/>
    </g>
    <g class="pixel" fill="#484f58">
      <rect x="0" y="12" width="6" height="6"/><rect x="12" y="12" width="6" height="6"/>
    </g>
  </g>

  <!-- HAZARD asteroid: passes lower down -> triggers the DOWN dodge -->
  <g class="asteroid hazard-down">
    <g class="pixel" fill="#6e7681">
      <rect x="6" y="0" width="6" height="6"/>
      <rect x="0" y="6" width="6" height="6"/><rect x="6" y="6" width="6" height="6"/><rect x="12" y="6" width="6" height="6"/><rect x="18" y="6" width="6" height="6"/>
      <rect x="6" y="12" width="6" height="6"/><rect x="12" y="12" width="6" height="6"/>
    </g>
    <g class="pixel" fill="#484f58"><rect x="0" y="6" width="6" height="6"/></g>
  </g>

  <!-- ambient asteroids: pass above/below the action lane, purely decorative -->
  <g class="asteroid drift-top">
    <g class="pixel" fill="#8b949e">
      <rect x="0" y="0" width="6" height="6"/><rect x="6" y="0" width="6" height="6"/>
      <rect x="0" y="6" width="6" height="6"/><rect x="6" y="6" width="6" height="6"/><rect x="12" y="6" width="6" height="6"/>
      <rect x="6" y="12" width="6" height="6"/>
    </g>
  </g>

  <g class="asteroid drift-bottom">
    <g class="pixel" fill="#8b949e">
      <rect x="0" y="6" width="6" height="6"/><rect x="6" y="0" width="6" height="6"/><rect x="12" y="6" width="6" height="6"/>
      <rect x="6" y="6" width="6" height="6"/><rect x="6" y="12" width="6" height="6"/>
    </g>
  </g>

  <!-- near-miss sparks, flashing right where each hazard would have connected -->
  <g class="spark spark-up" transform="translate(428,84)">
    <g fill="#fff3b0">
      <rect x="-2" y="-8" width="4" height="6"/>
      <rect x="-2" y="4"  width="4" height="6"/>
      <rect x="-8" y="-2" width="6" height="4"/>
      <rect x="4"  y="-2" width="6" height="4"/>
    </g>
  </g>
  <g class="spark spark-down" transform="translate(423,104)">
    <g fill="#fff3b0">
      <rect x="-2" y="-8" width="4" height="6"/>
      <rect x="-2" y="4"  width="4" height="6"/>
      <rect x="-8" y="-2" width="6" height="4"/>
      <rect x="4"  y="-2" width="6" height="4"/>
    </g>
  </g>

  <!-- SPACESHIP (built from 6x6 pixel blocks), base position baked into shipDodge frame 0% -->
  <g id="ship">
    <!-- nose tip -->
    <rect class="pixel" x="18" y="0"  width="6" height="6" fill="#a5d6ff"/>
    <!-- upper body -->
    <rect class="pixel" x="12" y="6"  width="6" height="6" fill="#58a6ff"/>
    <rect class="pixel" x="18" y="6"  width="6" height="6" fill="#58a6ff"/>
    <rect class="pixel" x="24" y="6"  width="6" height="6" fill="#58a6ff"/>
    <!-- cockpit window row -->
    <rect class="pixel" x="6"  y="12" width="6" height="6" fill="#58a6ff"/>
    <rect class="pixel" x="12" y="12" width="6" height="6" fill="#79c0ff"/>
    <rect class="pixel" x="18" y="12" width="6" height="6" fill="#a5d6ff"/>
    <rect class="pixel" x="24" y="12" width="6" height="6" fill="#79c0ff"/>
    <rect class="pixel" x="30" y="12" width="6" height="6" fill="#58a6ff"/>
    <!-- mid body -->
    <rect class="pixel" x="6"  y="18" width="6" height="6" fill="#388bfd"/>
    <rect class="pixel" x="12" y="18" width="6" height="6" fill="#388bfd"/>
    <rect class="pixel" x="18" y="18" width="6" height="6" fill="#58a6ff"/>
    <rect class="pixel" x="24" y="18" width="6" height="6" fill="#388bfd"/>
    <rect class="pixel" x="30" y="18" width="6" height="6" fill="#388bfd"/>
    <!-- fins row -->
    <rect class="pixel" x="0"  y="24" width="6" height="6" fill="#bc8cff"/>
    <rect class="pixel" x="6"  y="24" width="6" height="6" fill="#388bfd"/>
    <rect class="pixel" x="12" y="24" width="6" height="6" fill="#30363d"/>
    <rect class="pixel" x="18" y="24" width="6" height="6" fill="#388bfd"/>
    <rect class="pixel" x="24" y="24" width="6" height="6" fill="#30363d"/>
    <rect class="pixel" x="30" y="24" width="6" height="6" fill="#388bfd"/>
    <rect class="pixel" x="36" y="24" width="6" height="6" fill="#bc8cff"/>
    <!-- nozzle -->
    <rect class="pixel" x="12" y="30" width="6" height="6" fill="#21262d"/>
    <rect class="pixel" x="18" y="30" width="6" height="6" fill="#30363d"/>
    <rect class="pixel" x="24" y="30" width="6" height="6" fill="#21262d"/>

    <!-- flame -->
    <g id="flame">
      <rect x="15" y="36" width="6"  height="12" fill="url(#flame)"/>
      <rect x="21" y="36" width="6"  height="16" fill="url(#flame)"/>
      <rect x="27" y="36" width="6"  height="12" fill="url(#flame)"/>
    </g>
  </g>

  <!-- HUD text -->
  <text id="hud" x="24" y="28" font-family="'Courier New', monospace" font-size="16" font-weight="bold" fill="#79c0ff" letter-spacing="2">
    LAUNCHING ADITYA.EXE
  </text>
  <text x="24" y="200" font-family="'Courier New', monospace" font-size="12" fill="#8b949e" letter-spacing="1">
    &gt; ACCOUNTS x DATA_ANALYTICS &#8212; STATUS: ONLINE
  </text>
</svg>
